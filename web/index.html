<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#1f6feb" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="OpenFuture" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <title>OpenFuture</title>
    <style>
      :root {
        --bg: #ffffff;
        --sidebar: #f7f7f8;
        --panel: #ffffff;
        --text: #1f2328;
        --muted: #6b7280;
        --faint: #9ca3af;
        --border: #e5e7eb;
        --hover: #ececee;
        --accent: #4d6bfe;
        --accent-soft: #eef2ff;
        --user-bubble: #eef2ff;
        --code-bg: #f6f8fa;
        --danger: #dc2626;
        --ok: #16a34a;
        --shadow: 0 1px 2px rgba(15, 23, 42, 0.06), 0 8px 24px rgba(15, 23, 42, 0.06);
        --radius: 14px;
      }
      :root[data-theme='dark'] {
        --bg: #1c1d21;
        --sidebar: #17181b;
        --panel: #232429;
        --text: #ececf1;
        --muted: #9b9ba3;
        --faint: #6f6f78;
        --border: #303138;
        --hover: #2a2b31;
        --accent: #7c94ff;
        --accent-soft: #262a3d;
        --user-bubble: #2b3040;
        --code-bg: #16171a;
        --danger: #f87171;
        --ok: #4ade80;
        --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 12px 32px rgba(0, 0, 0, 0.35);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        background: var(--bg);
        color: var(--text);
        font: 15px/1.65 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', system-ui, -apple-system, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      button,
      input,
      textarea,
      select {
        font: inherit;
        color: inherit;
      }
      button {
        cursor: pointer;
      }
      .app {
        display: flex;
        height: 100%;
        height: var(--app-h, 100%);
        overflow: hidden;
      }

      /* ── 侧栏 ─────────────────────────────────────── */
      .sidebar {
        width: 272px;
        flex: 0 0 272px;
        background: var(--sidebar);
        border-right: 1px solid var(--border);
        display: flex;
        flex-direction: column;
        padding: 14px 12px 12px;
        gap: 10px;
        transition: transform 0.22s ease;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 4px 6px 2px;
        font-weight: 650;
        letter-spacing: 0.2px;
      }
      .brand-mark {
        width: 28px;
        height: 28px;
        border-radius: 9px;
        display: grid;
        place-items: center;
        background: linear-gradient(135deg, #4d6bfe, #7c3aed);
        color: #fff;
        font-size: 13px;
        font-weight: 800;
      }
      .brand small {
        display: block;
        font-size: 11px;
        font-weight: 500;
        color: var(--faint);
        letter-spacing: 0.4px;
      }
      .new-chat {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        width: 100%;
        padding: 10px 12px;
        border-radius: 12px;
        border: 1px solid var(--border);
        background: var(--panel);
        font-weight: 600;
        transition: border-color 0.15s ease, background 0.15s ease;
      }
      .new-chat:hover {
        border-color: var(--accent);
        color: var(--accent);
      }
      .project-row {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 0 2px;
      }
      .project-row select {
        flex: 1;
        min-width: 0;
        padding: 7px 8px;
        border-radius: 9px;
        border: 1px solid var(--border);
        background: var(--panel);
        font-size: 13px;
        outline: none;
      }
      .search-row {
        position: relative;
      }
      .search-row input {
        width: 100%;
        padding: 8px 10px 8px 30px;
        border-radius: 10px;
        border: 1px solid var(--border);
        background: var(--panel);
        font-size: 13px;
        outline: none;
      }
      .search-row span {
        position: absolute;
        left: 10px;
        top: 50%;
        transform: translateY(-50%);
        color: var(--faint);
        font-size: 13px;
        pointer-events: none;
      }
      .select-toggle {
        border: 0;
        background: transparent;
        color: var(--muted);
        font-size: 15px;
        cursor: pointer;
        padding: 2px 4px;
        border-radius: 6px;
      }
      .select-toggle.on { color: var(--accent); background: var(--accent-soft); }
      .select-bar {
        display: flex;
        align-items: center;
        gap: 6px;
        margin: 0 12px 8px;
        padding: 6px 8px;
        border: 1px solid var(--border);
        border-radius: 10px;
        background: var(--panel);
        font-size: 12px;
      }
      .select-bar span { flex: 1; color: var(--muted); }
      .select-bar button {
        border: 1px solid var(--border);
        background: var(--panel);
        color: var(--text);
        border-radius: 7px;
        padding: 3px 8px;
        font-size: 12px;
        cursor: pointer;
      }
      .select-bar button.danger { color: #d33; border-color: rgba(221, 51, 51, 0.35); }
      .select-bar button:disabled { opacity: 0.45; cursor: default; }
      .conv .check {
        width: 16px;
        height: 16px;
        margin-left: auto;
        border: 1px solid var(--border);
        border-radius: 4px;
        display: grid;
        place-items: center;
        font-size: 11px;
        color: var(--accent);
        flex: none;
      }
      .conv.selected { background: var(--accent-soft); }
      .conversations {
        flex: 1;
        overflow-y: auto;
        margin: 2px -6px 0;
        padding: 0 6px 8px;
      }
      .group-label {
        font-size: 11px;
        color: var(--faint);
        padding: 12px 8px 4px;
        letter-spacing: 0.3px;
      }
      .conv {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 8px 9px;
        border-radius: 10px;
        cursor: pointer;
        color: var(--text);
        position: relative;
      }
      .conv:hover {
        background: var(--hover);
      }
      .conv.active {
        background: var(--accent-soft);
        color: var(--accent);
        font-weight: 600;
      }
      .conv .title {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-size: 13.5px;
      }
      .conv .more {
        opacity: 0;
        border: 0;
        background: transparent;
        color: inherit;
        padding: 0 2px;
        border-radius: 6px;
        font-size: 14px;
      }
      .conv:hover .more,
      .conv.active .more {
        opacity: 0.7;
      }
      .conv .pin {
        font-size: 10px;
        margin-right: 2px;
        opacity: 0.85;
      }

      .msg.user:hover .msg-actions,
      .msg.user:focus-within .msg-actions {
        opacity: 1;
      }

      .find-bar {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 16px;
        border-bottom: 1px solid var(--border);
        background: var(--panel);
        font-size: 13px;
      }

      .find-bar input {
        flex: 1;
        max-width: 320px;
        border: 1px solid var(--border);
        background: var(--bg);
        color: var(--text);
        border-radius: 8px;
        padding: 6px 10px;
        outline: none;
      }

      .find-bar input:focus {
        border-color: var(--accent);
      }

      .find-bar span {
        color: var(--muted);
        min-width: 54px;
      }

      .find-bar button {
        border: 1px solid var(--border);
        background: var(--panel);
        color: var(--muted);
        border-radius: 7px;
        width: 28px;
        height: 28px;
        cursor: pointer;
      }

      .find-bar button:hover {
        color: var(--accent);
        border-color: var(--accent);
      }

      .conn-banner {
        cursor: pointer;
      }

      .to-bottom {
        position: absolute;
        right: 26px;
        bottom: 148px;
        width: 38px;
        height: 38px;
        border-radius: 50%;
        border: 1px solid var(--border);
        background: var(--panel);
        color: var(--text);
        font-size: 17px;
        cursor: pointer;
        box-shadow: 0 9px 22px rgba(20, 28, 46, 0.16);
        z-index: 6;
      }

      .to-bottom.new {
        border-color: var(--accent);
        color: var(--accent);
      }

      .main {
        position: relative;
      }

      .conv-menu {
        position: fixed;
        z-index: 60;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 10px;
        box-shadow: var(--shadow);
        padding: 4px;
        min-width: 132px;
      }
      .conv-menu button {
        display: block;
        width: 100%;
        text-align: left;
        border: 0;
        background: transparent;
        padding: 7px 10px;
        border-radius: 7px;
        font-size: 13px;
      }
      .conv-menu button:hover {
        background: var(--hover);
      }
      .conv-menu button.danger {
        color: var(--danger);
      }
      .sidebar-footer {
        border-top: 1px solid var(--border);
        padding-top: 10px;
        display: flex;
        align-items: center;
        gap: 9px;
        font-size: 12.5px;
      }
      .avatar {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        background: linear-gradient(135deg, #4d6bfe, #7c3aed);
        color: #fff;
        display: grid;
        place-items: center;
        font-size: 12px;
        font-weight: 700;
        flex: 0 0 28px;
      }
      .sidebar-footer .avatar {
        border: 0;
        cursor: pointer;
        padding: 0;
      }
      .sidebar-footer .meta {
        flex: 1;
        min-width: 0;
      }
      .sidebar-footer .meta b {
        display: block;
        font-size: 12.5px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .sidebar-footer .meta small {
        color: var(--faint);
        font-size: 11px;
      }
      .icon-button {
        border: 1px solid var(--border);
        background: var(--panel);
        border-radius: 9px;
        width: 30px;
        height: 30px;
        display: grid;
        place-items: center;
        font-size: 14px;
      }

      /* ── 主区 ─────────────────────────────────────── */
      .main {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
        background: var(--bg);
        position: relative;
      }
      .topbar {
        height: 54px;
        flex: 0 0 54px;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 0 18px;
        border-bottom: 1px solid var(--border);
        background: color-mix(in srgb, var(--bg) 86%, transparent);
        backdrop-filter: blur(8px);
      }
      .topbar .title {
        flex: 1;
        min-width: 0;
        font-weight: 600;
        font-size: 14px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .chip {
        font-size: 11.5px;
        color: var(--muted);
        border: 1px solid var(--border);
        padding: 3px 9px;
        border-radius: 999px;
        white-space: nowrap;
      }
      .status-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--faint);
      }
      .status-dot.online {
        background: var(--ok);
      }
      .status-dot.busy {
        background: #f59e0b;
        animation: pulse 1.2s infinite;
      }
      @keyframes pulse {
        50% {
          opacity: 0.35;
        }
      }
      .menu-button {
        display: none;
      }

      .chat-scroll {
        flex: 1;
        overflow-y: auto;
        scroll-behavior: auto;
      }
      .chat {
        max-width: 780px;
        margin: 0 auto;
        padding: 26px 22px 150px;
        display: flex;
        flex-direction: column;
        gap: 22px;
      }
      .empty {
        margin: auto;
        text-align: center;
        padding: 12vh 20px 0;
        color: var(--muted);
      }
      .empty .mark {
        width: 52px;
        height: 52px;
        margin: 0 auto 16px;
        border-radius: 16px;
        display: grid;
        place-items: center;
        background: linear-gradient(135deg, #4d6bfe, #7c3aed);
        color: #fff;
        font-weight: 800;
        font-size: 19px;
      }
      .empty h1 {
        margin: 0 0 6px;
        font-size: 25px;
        color: var(--text);
        letter-spacing: -0.2px;
      }
      .suggestions {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
        max-width: 560px;
        margin: 26px auto 0;
      }
      .suggestion {
        text-align: left;
        border: 1px solid var(--border);
        background: var(--panel);
        border-radius: 12px;
        padding: 12px 14px;
        font-size: 13px;
        color: var(--muted);
        transition: border-color 0.15s ease, transform 0.15s ease;
      }
      .suggestion:hover {
        border-color: var(--accent);
        transform: translateY(-1px);
      }
      .suggestion b {
        display: block;
        color: var(--text);
        font-size: 13.5px;
        margin-bottom: 2px;
      }

      .msg {
        display: flex;
        gap: 12px;
        max-width: 100%;
      }
      .msg .who {
        width: 30px;
        height: 30px;
        flex: 0 0 30px;
        border-radius: 9px;
        display: grid;
        place-items: center;
        font-size: 12px;
        font-weight: 750;
        background: var(--code-bg);
        border: 1px solid var(--border);
        color: var(--muted);
      }
      .msg.assistant .who {
        background: linear-gradient(135deg, #4d6bfe, #7c3aed);
        border: 0;
        color: #fff;
      }
      .bubble {
        min-width: 0;
        max-width: 100%;
        flex: 1;
      }
      .msg.user {
        justify-content: flex-end;
        flex-direction: row-reverse;
      }
      .msg.user .bubble {
        flex: 0 1 auto;
        max-width: 80%;
        background: var(--user-bubble);
        border-radius: 16px;
        padding: 10px 14px;
        white-space: pre-wrap;
        word-break: break-word;
      }
      .msg.user .who {
        background: var(--panel);
      }
      .md {
        word-break: break-word;
      }
      .md > :first-child {
        margin-top: 0;
      }
      .md > :last-child {
        margin-bottom: 0;
      }
      .md p {
        margin: 0 0 10px;
      }
      .md h1,
      .md h2,
      .md h3 {
        margin: 18px 0 8px;
        line-height: 1.35;
      }
      .md h1 {
        font-size: 21px;
      }
      .md h2 {
        font-size: 18px;
      }
      .md h3 {
        font-size: 15.5px;
      }
      .md ul,
      .md ol {
        margin: 0 0 10px;
        padding-left: 22px;
      }
      .md li {
        margin: 3px 0;
      }
      .md a {
        color: var(--accent);
      }
      .md blockquote {
        margin: 0 0 10px;
        padding: 6px 12px;
        border-left: 3px solid var(--border);
        color: var(--muted);
      }
      .md code {
        background: var(--code-bg);
        border-radius: 5px;
        padding: 1px 5px;
        font-size: 0.9em;
        font-family: 'Cascadia Code', Consolas, 'Courier New', monospace;
      }
      .code-block {
        border: 1px solid var(--border);
        border-radius: 11px;
        overflow: hidden;
        margin: 0 0 12px;
        background: var(--code-bg);
      }
      .code-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 6px 10px;
        border-bottom: 1px solid var(--border);
        font-size: 11.5px;
        color: var(--muted);
      }
      .code-head button {
        border: 0;
        background: transparent;
        color: var(--muted);
        font-size: 11.5px;
        padding: 2px 6px;
        border-radius: 6px;
      }
      .code-head button:hover {
        background: var(--hover);
        color: var(--text);
      }
      .code-block pre {
        margin: 0;
        padding: 12px 14px;
        overflow-x: auto;
        font-size: 12.8px;
        line-height: 1.6;
      }
      .code-block pre code {
        background: transparent;
        padding: 0;
        font-size: inherit;
      }
      .code-tools { display: flex; gap: 2px; }
      .code-block pre code .line { display: block; white-space: pre; }
      .code-block .ln {
        display: inline-block;
        width: 2.4em;
        padding-right: 10px;
        text-align: right;
        color: var(--muted);
        opacity: 0.5;
        user-select: none;
      }
      .code-block .ln::before { content: counter(code-line); counter-increment: code-line; }
      .code-block pre { counter-reset: code-line; }
      body.no-line-numbers .ln { display: none; }
      .code-foot {
        border-top: 1px dashed var(--border);
        padding: 5px 10px;
        text-align: center;
      }
      .code-foot button {
        border: 0;
        background: transparent;
        color: var(--muted);
        font-size: 11.5px;
        cursor: pointer;
      }
      .code-foot button:hover { color: var(--text); }
      .thinking {
        margin-bottom: 10px;
        border: 1px dashed var(--border);
        border-radius: 10px;
        padding: 8px 12px;
        color: var(--muted);
        font-size: 13px;
      }
      .thinking summary {
        cursor: pointer;
        font-size: 12.5px;
        color: var(--faint);
      }
      .thinking div {
        margin-top: 6px;
        white-space: pre-wrap;
      }
      .tool-line {
        display: flex;
        align-items: center;
        gap: 7px;
        font-size: 12.5px;
        color: var(--muted);
        padding: 3px 0;
      }
      .tool-line .dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--accent);
        animation: pulse 1.1s infinite;
      }
      .tool-line.done .dot {
        background: var(--ok);
        animation: none;
      }
      .tool-line.fail .dot {
        background: var(--danger);
        animation: none;
      }
      .skeleton {
        padding: 4px 0 18px;
        display: flex; flex-direction: column; gap: 8px;
      }
      .skeleton span {
        height: 12px; border-radius: 6px;
        background: linear-gradient(90deg, var(--line) 25%, var(--panel) 37%, var(--line) 63%);
        background-size: 400% 100%;
        animation: shimmer 1.3s ease-in-out infinite;
      }
      .skeleton span:nth-child(2) { width: 82%; }
      .skeleton span:nth-child(3) { width: 64%; }
      @keyframes shimmer { 0% { background-position: 100% 50%; } 100% { background-position: 0 50%; } }
      .msg-meta {
        font-size: 11px;
        color: var(--muted);
        margin: 4px 8px 0;
        opacity: 0.75;
      }
      .msg.user .msg-meta { text-align: right; }
      .msg-actions {
        display: flex;
        gap: 6px;
        margin-top: 8px;
        opacity: 0;
        transition: opacity 0.12s ease;
      }
      .msg.assistant:hover .msg-actions,
      .msg-actions:focus-within {
        opacity: 1;
      }
      .msg-actions button {
        border: 1px solid var(--border);
        background: var(--panel);
        color: var(--muted);
        border-radius: 8px;
        font-size: 11.5px;
        padding: 3px 8px;
      }
      .msg-actions button:hover {
        color: var(--accent);
        border-color: var(--accent);
      }
      .cursor {
        display: inline-block;
        width: 7px;
        height: 15px;
        background: var(--accent);
        vertical-align: -2px;
        margin-left: 2px;
        animation: blink 1s step-start infinite;
      }
      @keyframes blink {
        50% {
          opacity: 0;
        }
      }

      .prompt-card {
        border: 1px solid var(--accent);
        background: var(--accent-soft);
        border-radius: 13px;
        padding: 13px 15px;
      }
      .prompt-card h4 {
        margin: 0 0 3px;
        font-size: 13px;
      }
      .prompt-card .q {
        margin: 0 0 10px;
        font-size: 13.5px;
      }
      .prompt-option {
        display: block;
        width: 100%;
        text-align: left;
        border: 1px solid var(--border);
        background: var(--panel);
        border-radius: 9px;
        padding: 8px 11px;
        margin-bottom: 7px;
      }
      .prompt-option:hover {
        border-color: var(--accent);
      }
      .prompt-option b {
        font-size: 13px;
      }
      .prompt-option small {
        display: block;
        color: var(--muted);
        font-size: 12px;
      }
      .prompt-custom {
        display: flex;
        gap: 7px;
        margin-top: 6px;
      }
      .prompt-custom input {
        flex: 1;
        min-width: 0;
        border: 1px solid var(--border);
        border-radius: 9px;
        padding: 7px 10px;
        background: var(--panel);
        outline: none;
      }
      .button-primary {
        border: 0;
        background: var(--accent);
        color: #fff;
        border-radius: 9px;
        padding: 8px 13px;
        font-weight: 600;
        font-size: 13px;
      }
      .button-ghost {
        border: 1px solid var(--border);
        background: transparent;
        border-radius: 9px;
        padding: 7px 12px;
        font-size: 12.5px;
        color: var(--muted);
      }
      .setup-hint {
        margin: 18px auto 0;
        max-width: 620px;
        border: 1px dashed var(--border);
        border-radius: 12px;
        padding: 14px 16px;
        display: grid;
        gap: 6px;
        color: var(--muted);
        font-size: 13px;
      }
      .setup-hint b { color: var(--text); font-size: 14px; }

      .error-line button {
