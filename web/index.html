    <script>
      'use strict'

      const state = {
        projectId: localStorage.getItem('of.web.project') || null,
        conversationId: null,
        sessionId: null,
        title: '',
        projects: [],
        conversations: [],
        filter: '',
        messages: [],
        streaming: false,
        prompt: null,
        lastSeq: 0,
        source: null,
        settings: null,
        loading: true,
        error: null,
        attachments: [],
        windowSize: 60,
        selectMode: false,
        selected: new Set(),
        pinned: (() => {
          try {
            const value = JSON.parse(localStorage.getItem('of.web.pinned') || '[]')
            return Array.isArray(value) ? value : []
          } catch {
            return []
          }
        })()
      }
      // Exposed for diagnostics and automated checks (read-only usage).
      window.__of = state

      const $ = (id) => document.getElementById(id)
      const chat = $('chat')
      const chatScroll = $('chatScroll')
      const input = $('input')

      // ── 工具函数 ─────────────────────────────────────
      function escapeHtml(value) {
        return String(value ?? '')
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
      }

      function relativeTime(at) {
        const diff = Date.now() - at
        if (diff < 60_000) return '刚刚'
        if (diff < 3_600_000) return Math.floor(diff / 60_000) + ' 分钟前'
        if (diff < 86_400_000) return Math.floor(diff / 3_600_000) + ' 小时前'
        if (diff < 7 * 86_400_000) return Math.floor(diff / 86_400_000) + ' 天前'
        return new Date(at).toLocaleDateString('zh-CN', { month: 'numeric', day: 'numeric' })
      }

      function dayGroup(at) {
        const d = new Date(at)
        const now = new Date()
        const start = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime()
        if (d.getTime() >= start) return '今天'
        if (d.getTime() >= start - 86_400_000) return '昨天'
        if (d.getTime() >= start - 7 * 86_400_000) return '最近 7 天'
        return '更早'
      }

      function toast(text) {
        const el = $('toast')
        el.textContent = text
        el.classList.add('show')
        clearTimeout(toast.timer)
        toast.timer = setTimeout(() => el.classList.remove('show'), 1800)
      }

      async function api(path, options = {}) {
        const response = await fetch(path, {
          headers: { 'Content-Type': 'application/json' },
          ...options
        })
        let data = null
        try {
          data = await response.json()
        } catch {
          // ignore
        }
        if (!response.ok || !data || data.ok !== true) {
          const error = new Error((data && data.error && data.error.message) || '请求失败（' + response.status + '）')
          error.code = data && data.error && data.error.code
          throw error
        }
        return data.value
      }

      let wasOffline = false
      let reconnectDelay = 1000
      let reconnectTimer = null

      function bannerText(text) {
        const banner = $('connBanner')
        if (text) banner.textContent = text
      }

      function setStatus(mode) {
        const dot = $('statusDot')
        dot.className = 'status-dot' + (mode ? ' ' + mode : '')
        dot.title = mode === 'online' ? '已连接' : mode === 'busy' ? '生成中' : '已断开'
        const banner = $('connBanner')
        const wasHidden = banner.hidden
        banner.hidden = mode === 'online' || mode === 'busy'
        if (!banner.hidden && wasHidden) {
          bannerText(navigator.onLine === false ? '网络已断开，恢复后会自动重连…' : '连接已断开，正在自动重连…（点击立即重试）')
        }
        if (banner.hidden && wasOffline) {
          wasOffline = false
          toast('连接已恢复')
        }
        if (!banner.hidden) wasOffline = true
      }

      function scheduleReconnect() {
        if (reconnectTimer) clearTimeout(reconnectTimer)
        const seconds = Math.round(reconnectDelay / 1000)
        bannerText('连接已断开，' + seconds + ' 秒后重试…（点击立即重试）')
        reconnectTimer = setTimeout(() => {
          reconnectTimer = null
          connect()
        }, reconnectDelay)
        reconnectDelay = Math.min(30000, reconnectDelay * 2)
      }

      const codeChunks = new Map()

      // ── Markdown（够用就好：代码块、标题、列表、粗体、行内代码、链接） ──
      function renderMarkdown(text) {
        const escaped = escapeHtml(text)
        const blocks = []
        let rest = escaped.replace(/```([\w+-]*)\n([\s\S]*?)```/g, (_, lang, code) => {
          const index = blocks.length
          const raw = code.replace(/\n$/, '')
          const rows = raw.split('\n')
          codeChunks.set(index, { lang: lang || 'code', text: raw, lines: rows })
          const renderLines = (list) =>
            list
              .map((line) => '<span class="line"><span class="ln"></span>' + line + '</span>')
              .join('')
          const tooLong = rows.length > 40
          const shown = tooLong ? rows.slice(0, 40) : rows
          blocks.push(
            '<div class="code-block" data-code="' + index + '">' +
              '<div class="code-head"><span class="code-lang">' +
              (lang || 'code') +
              '</span><span class="code-tools">' +
              '<button type="button" data-copy="' + index + '">复制</button>' +
              '<button type="button" data-download="' + index + '">下载</button>' +
              '</span></div><pre><code>' + renderLines(shown) + '</code></pre>' +
              (tooLong ? '<div class="code-foot"><button type="button" data-expand="' + index + '">展开全部 ' + rows.length + ' 行</button></div>' : '') +
              '</div>'
          )
          return '@@OFCODE' + index + '@@'
        })

        const lines = rest.split('\n')
        const out = []
        let list = null
        let paragraph = []

        const flushParagraph = () => {
          if (!paragraph.length) return
          out.push('<p>' + paragraph.join('<br>') + '</p>')
          paragraph = []
        }
        const closeList = () => {
          if (list) {
            out.push('</' + list + '>')
            list = null
          }
        }

        const inline = (line) =>
          line
            .replace(/`([^`]+)`/g, '<code>$1</code>')
            .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
            .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noreferrer">$1</a>')

        for (let i = 0; i < lines.length; i += 1) {
          const raw = lines[i]
          const line = raw.trimEnd()
          if (/^\|.*\|$/.test(line.trim())) {
            flushParagraph()
            closeList()
            const rows = []
            while (i < lines.length && /^\|.*\|$/.test(lines[i].trim())) {
              rows.push(lines[i].trim())
              i += 1
            }
            i -= 1
            const cells = (row) =>
              row.replace(/^\||\|$/g, '').split('|').map((cell) => cell.trim())
            const isSep = (row) => {
              const parts = cells(row)
              return parts.length > 0 && parts.every((cell) => /^:?-{2,}:?$/.test(cell))
            }
            const head = rows.length > 1 && isSep(rows[1]) ? cells(rows[0]) : null
            let table = '<div class="table-wrap"><table>'
            if (head) table += '<thead><tr>' + head.map((cell) => '<th>' + inline(cell) + '</th>').join('') + '</tr></thead>'
            table += '<tbody>'
            for (let r = head ? 2 : 0; r < rows.length; r += 1) {
              if (isSep(rows[r])) continue
              table += '<tr>' + cells(rows[r]).map((cell) => '<td>' + inline(cell) + '</td>').join('') + '</tr>'
            }
            table += '</tbody></table></div>'
            out.push(table)
            continue
          }
          const blockMatch = line.match(/^@@OFCODE(\d+)@@$/)
          if (blockMatch) {
            flushParagraph()
            closeList()
            out.push(blocks[Number(blockMatch[1])])
            continue
          }
          if (!line.trim()) {
            flushParagraph()
            closeList()
            continue
          }
          const heading = line.match(/^(#{1,3})\s+(.*)$/)
          if (heading) {
            flushParagraph()
            closeList()
            out.push('<h' + heading[1].length + '>' + inline(heading[2]) + '</h' + heading[1].length + '>')
            continue
          }
          const ordered = line.match(/^\s*\d+[.)]\s+(.*)$/)
          const bullet = line.match(/^\s*[-*•]\s+(.*)$/)
          if (ordered || bullet) {
            flushParagraph()
            const kind = ordered ? 'ol' : 'ul'
            if (list !== kind) {
              closeList()
              out.push('<' + kind + '>')
              list = kind
            }
            out.push('<li>' + inline((ordered || bullet)[1]) + '</li>')
            continue
          }
          if (/^&gt;\s?/.test(line)) {
            flushParagraph()
            closeList()
            out.push('<blockquote>' + inline(line.replace(/^&gt;\s?/, '')) + '</blockquote>')
            continue
          }
          closeList()
          paragraph.push(inline(line))
        }
        flushParagraph()
        closeList()
        return out.join('') || '<p></p>'
      }

      // ── 渲染 ────────────────────────────────────────
      function groupedConversations() {
        const match = (item) =>
          state.filter ? item.title.toLowerCase().includes(state.filter.toLowerCase()) : true
        const items = state.conversations.filter(match)
        const groups = new Map()
        const pinned = items.filter((item) => state.pinned.includes(item.id))
        if (pinned.length) groups.set('置顶', pinned)
        for (const item of items) {
          if (state.pinned.includes(item.id)) continue
          const key = dayGroup(item.updatedAt || item.createdAt)
          if (!groups.has(key)) groups.set(key, [])
          groups.get(key).push(item)
        }
        return groups
      }

      function isPinned(id) {
        return state.pinned.includes(id)
      }

      function togglePin(id) {
        state.pinned = isPinned(id) ? state.pinned.filter((item) => item !== id) : [id].concat(state.pinned)
        localStorage.setItem('of.web.pinned', JSON.stringify(state.pinned))
        renderSidebar()
        toast(isPinned(id) ? '已置顶' : '已取消置顶')
      }

      function renderSidebar() {
        const select = $('projectSelect')
        select.innerHTML = state.projects
          .map(
            (project) =>
              '<option value="' +
              escapeHtml(project.id) +
              '"' +
              (project.id === state.projectId ? ' selected' : '') +
              '>' +
              escapeHtml(project.name) +
              (project.available ? '' : '（不可用）') +
              '</option>'
          )
          .join('')

        const box = $('conversations')
        if (state.loading) {
          box.innerHTML = '<div class="skeleton">加载中…</div>'
          return
        }
        const groups = groupedConversations()
        if (!groups.size) {
          box.innerHTML = '<div class="skeleton">这个项目还没有对话</div>'
          return
        }
        let html = ''
        for (const [label, items] of groups) {
          html += '<div class="group-label">' + label + '</div>'
          for (const item of items) {
            html +=
              '<div class="conv' +
              (item.id === state.conversationId ? ' active' : '') +
              (state.selectMode && state.selected.has(item.id) ? ' selected' : '') +
              '" data-id="' +
              escapeHtml(item.id) +
              '" title="' +
              escapeHtml(item.title) +
              '">' +
              (isPinned(item.id) ? '<span class="pin" title="已置顶">📌</span>' : '') +
              '<span class="title">' +
              escapeHtml(item.title || '新对话') +
              '</span>' +
              (state.selectMode
                ? '<span class="check">' + (state.selected.has(item.id) ? '✓' : '') + '</span>'
                : '<button class="more" data-more="' +
                  escapeHtml(item.id) +
                  '" title="更多">⋯</button>') +
              '</div>'
          }
        }
        box.innerHTML = html
      }

      function coalesceMessages(messages) {
        const out = []
        for (const message of messages) {
          const last = out[out.length - 1]
          const empty = !message.text && !message.thinking && !(message.tools || []).length
          if (empty && message.role === 'assistant') continue
          if (last && last.role === 'assistant' && message.role === 'assistant') {
            if (message.thinking) last.thinking = last.thinking ? last.thinking + '\n\n' + message.thinking : message.thinking
            if (message.text) last.text = last.text ? last.text + '\n\n' + message.text : message.text
            last.tools = (last.tools || []).concat(message.tools || [])
            last.streaming = last.streaming || message.streaming
            if (message.usage) last.usage = message.usage
            last.timestamp = message.timestamp || last.timestamp
            continue
          }
          out.push({ ...message, tools: [...(message.tools || [])] })
        }
        return out
      }

      function formatTokens(n) {
        if (!n && n !== 0) return ''
        return n >= 1000 ? (n / 1000).toFixed(n >= 10000 ? 0 : 1) + 'k' : String(n)
      }

      function formatDuration(ms) {
        if (typeof ms !== 'number' || !isFinite(ms) || ms <= 0) return ''
        return ms >= 10000 ? Math.round(ms / 1000) + ' 秒' : (ms / 1000).toFixed(1) + ' 秒'
      }

      function timeLabel(ts) {
        if (!ts) return ''
        const d = new Date(ts)
        const hh = String(d.getHours()).padStart(2, '0')
        const mm = String(d.getMinutes()).padStart(2, '0')
        const today = new Date()
        const sameDay = d.toDateString() === today.toDateString()
        return sameDay ? hh + ':' + mm : (d.getMonth() + 1) + '/' + d.getDate() + ' ' + hh + ':' + mm
      }

      function metaText(message) {
        const parts = []
        if (message.usage) {
          const ms = message.usage.durationMs
          const total = message.usage.totalTokens
          const duration = formatDuration(ms)
          if (duration) parts.push(duration)
          if (total) parts.push(formatTokens(total) + ' tokens')
          if (message.usage.input || message.usage.output) {
            parts.push('↑' + formatTokens(message.usage.input || 0) + ' ↓' + formatTokens(message.usage.output || 0))
          }
        }
        return parts.join(' · ')
      }

      function messageNode(message) {
        const wrap = document.createElement('div')
        wrap.className = 'msg ' + message.role
        wrap.dataset.id = message.id

        const who = document.createElement('span')
        who.className = 'who'
        who.textContent = message.role === 'user' ? '你' : 'OF'

        const bubble = document.createElement('div')
        bubble.className = 'bubble'

        if (message.role === 'user') {
          bubble.textContent = message.text
          const actions = document.createElement('div')
          actions.className = 'msg-actions'
          actions.innerHTML =
            '<button type="button" data-act="copy">复制</button>' +
            '<button type="button" data-act="quote">引用</button>' +
            '<button type="button" data-act="edit">编辑并重发</button>'
          bubble.appendChild(actions)
          const time = timeLabel(message.timestamp)
          if (time) {
            const meta = document.createElement('div')
            meta.className = 'msg-meta'
            meta.textContent = time
            wrap.append(who, bubble, meta)
            return wrap
          }
          wrap.append(who, bubble)
          return wrap
        }

        if (message.thinking) {
          const details = document.createElement('details')
          details.className = 'thinking'
          const summary = document.createElement('summary')
          summary.textContent = '思考过程'
          const body = document.createElement('div')
          body.textContent = message.thinking
          details.append(summary, body)
          bubble.appendChild(details)
        }

        for (const tool of message.tools || []) {
          const line = document.createElement('div')
          line.className = 'tool-line' + (tool.status === 'done' ? ' done' : tool.status === 'error' ? ' fail' : '')
          line.innerHTML = '<span class="dot"></span><span>' + escapeHtml(tool.label) + '</span>'
          bubble.appendChild(line)
        }

        const md = document.createElement('div')
        md.className = 'md'
        md.innerHTML = renderMarkdown(message.text || '')
        if (message.streaming) md.insertAdjacentHTML('beforeend', '<span class="cursor"></span>')
        bubble.appendChild(md)

        const actions = document.createElement('div')
        actions.className = 'msg-actions'
        actions.innerHTML =
          '<button type="button" data-act="copy">复制</button>' +
          '<button type="button" data-act="quote">引用</button>' +
          '<button type="button" data-act="retry">重新生成</button>'
        bubble.appendChild(actions)

        const meta = document.createElement('div')
        meta.className = 'msg-meta'
        const parts = [timeLabel(message.timestamp), metaText(message)].filter(Boolean)
        meta.textContent = parts.join(' · ')
        if (parts.length) wrap.append(who, bubble, meta)
        else wrap.append(who, bubble)
        return wrap
      }

      let shouldStick = true
      let renderQueued = false

      function scheduleRender() {
        if (renderQueued) return
        renderQueued = true
        requestAnimationFrame(() => {
          renderQueued = false
          renderChat()
        })
      }

      function patchStreaming(id) {
        const message = state.messages.find((item) => item.id === id)
        if (!message) return false
        const node = chat.querySelector('.msg[data-id="' + CSS.escape(id) + '"]')
        if (!node) return false
        const md = node.querySelector('.md')
        if (md) {
          md.innerHTML = renderMarkdown(message.text || '')
          if (message.streaming) md.insertAdjacentHTML('beforeend', '<span class="cursor"></span>')
        }
        const details = node.querySelector('.thinking div')
        if (details && message.thinking) details.textContent = message.thinking
        if (shouldStick) chatScroll.scrollTop = chatScroll.scrollHeight
        return true
      }

      function loadEarlier() {
        const before = chatScroll.scrollHeight
        const top = chatScroll.scrollTop
        state.windowSize += 60
        shouldStick = false
        renderChat()
        chatScroll.scrollTop = top + (chatScroll.scrollHeight - before)
      }

      function renderChat() {
        chat.innerHTML = ''

        if (state.loading && !state.messages.length) {
          for (let i = 0; i < 3; i += 1) {
            const sk = document.createElement('div')
            sk.className = 'skeleton'
            sk.innerHTML = '<span></span><span></span><span></span>'
            chat.appendChild(sk)
          }
          return
        }

        if (!state.messages.length && !state.loading) {
          chat.innerHTML =
            '<div class="empty">' +
            '<div class="mark">OF</div>' +
            '<h1>有什么可以帮你的？</h1>' +
            '<div>和桌面端共用项目、会话与记忆，打开就是同一份上下文。</div>' +
            '<div class="suggestions">' +
            '<button class="suggestion" data-suggest="帮我看看当前项目有哪些文件，并总结结构"><b>了解项目</b>梳理当前工作区的结构与入口</button>' +
            '<button class="suggestion" data-suggest="把我刚才的想法整理成一份可执行的实施计划"><b>写计划</b>把想法整理成可以执行的步骤</button>' +
            '<button class="suggestion" data-suggest="检查一下最近的改动有没有明显问题"><b>看代码</b>审查改动并给出风险点</button>' +
            '<button class="suggestion" data-suggest="用三句话解释这个项目在做什么"><b>写总结</b>快速生成一段项目介绍</button>' +
            '</div></div>'
        }

        const merged = coalesceMessages(state.messages)
        const hidden = Math.max(0, merged.length - state.windowSize)
        if (hidden > 0) {
          const earlier = document.createElement('button')
          earlier.type = 'button'
          earlier.className = 'load-earlier'
          earlier.textContent = '加载更早的 ' + hidden + ' 条消息'
          earlier.onclick = loadEarlier
          chat.appendChild(earlier)
        }
        for (const message of merged.slice(hidden)) chat.appendChild(messageNode(message))

        if (!state.loading && !state.messages.length && state.settings && !(state.settings.model && state.settings.model.modelId)) {
          const hint = document.createElement('div')
          hint.className = 'setup-hint'
          hint.innerHTML = '<b>还没有选择模型</b><span>请先在桌面端「设置 → 模型」里选好模型，网页端会自动同步；然后回到这里刷新即可。</span>'
          chat.appendChild(hint)
        }
        if (!state.loading && !state.projects.length) {
          const hint = document.createElement('div')
          hint.className = 'setup-hint'
          hint.innerHTML = '<b>还没有项目</b><span>在桌面端新建或打开一个项目后，这里会出现可以对话的工作区。</span>'
          chat.appendChild(hint)
        }

        if (state.prompt) chat.appendChild(promptNode(state.prompt))
        if (state.error) {
          const line = document.createElement('div')
          line.className = 'error-line'
          const text = document.createElement('span')
          text.textContent = state.error
          const retry = document.createElement('button')
          retry.type = 'button'
          retry.textContent = '重试'
          retry.onclick = () => retryLast()
          line.append(text, retry)
          chat.appendChild(line)
        }

        $('chatTitle').textContent = state.title || '新对话'
        input.disabled = false
        $('sendButton').disabled = !input.value.trim()
        $('stopButton').hidden = !state.streaming
        $('sendMode').hidden = !state.streaming
        $('composerHint').textContent = state.streaming
          ? '正在生成：Enter ' + ($('sendMode').value === 'followUp' ? '排队' : '插话') + ' · Shift + Enter 换行'
          : 'Enter 发送 · Shift + Enter 换行' + (input.value.length ? ' · ' + input.value.length + ' 字' : '')
        if (shouldStick) {
          chatScroll.scrollTop = chatScroll.scrollHeight
          requestAnimationFrame(updateToBottom)
        } else {
          updateToBottom()
        }
      }

      function promptNode(prompt) {
        const card = document.createElement('div')
        card.className = 'prompt-card'
        const title = document.createElement('h4')
        title.textContent = prompt.kind === 'confirm' ? '需要确认' : '需要你选择'
        const question = document.createElement('p')
        question.className = 'q'
        question.textContent = prompt.question
        card.append(title, question)

        ;(prompt.options || []).forEach((option, index) => {
          const button = document.createElement('button')
          button.className = 'prompt-option'
          const label = document.createElement('b')
          label.textContent = option.label
          button.appendChild(label)
          if (option.description) {
            const small = document.createElement('small')
            small.textContent = option.description
            button.appendChild(small)
          }
          button.addEventListener('click', () => answerPrompt({ optionIndex: index }))
          card.appendChild(button)
        })

        if (prompt.allowCustom) {
          const row = document.createElement('div')
          row.className = 'prompt-custom'
          const field = document.createElement('input')
          field.placeholder = '或者自己输入…'
          const send = document.createElement('button')
          send.className = 'button-primary'
          send.textContent = '发送'
          send.addEventListener('click', () => answerPrompt({ text: field.value }))
          field.addEventListener('keydown', (event) => {
            if (event.key === 'Enter') answerPrompt({ text: field.value })
          })
          row.append(field, send)
          card.appendChild(row)
        }

        const cancel = document.createElement('button')
        cancel.className = 'button-ghost'
        cancel.style.marginTop = '8px'
        cancel.textContent = '跳过'
        cancel.addEventListener('click', () => answerPrompt({ cancelled: true }))
        card.appendChild(cancel)
        return card
      }

      async function answerPrompt(payload) {
        const prompt = state.prompt
        if (!prompt) return
        try {
          await api('/api/prompts/answer', {
            method: 'POST',
            body: JSON.stringify({ id: prompt.id, sessionId: state.sessionId, ...payload })
          })
          state.prompt = null
          renderChat()
        } catch (error) {
          toast(error.message)
        }
      }

      // ── 数据加载 ────────────────────────────────────
      async function loadState() {
        try {
          const value = await api('/api/state')
          state.projects = value.projects || []
          state.settings = value.settings || null
          if (!state.projectId) state.projectId = value.activeProjectId || (state.projects[0] && state.projects[0].id) || null
          if (state.projectId && !state.projects.some((item) => item.id === state.projectId)) {
            state.projectId = value.activeProjectId || (state.projects[0] && state.projects[0].id) || null
          }
          const model = state.settings && state.settings.model
          $('modelChip').textContent = model ? model.displayName || model.modelId || '默认模型' : '未配置模型'
          if (model && model.modelId) {
            $('accountHint').textContent = '模型 · ' + model.modelId
          }
          if (!state.projectId) state.loading = false
          await loadConversations()
          renderSidebar()
          renderChat()
        } catch (error) {
          state.error = error.message
          state.loading = false
          renderSidebar()
          renderChat()
        }
      }

      async function loadConversations() {
        if (!state.projectId) {
          state.conversations = []
          return
        }
        localStorage.setItem('of.web.project', state.projectId)
        const value = await api('/api/projects/' + encodeURIComponent(state.projectId) + '/conversations')
        state.conversations = value.conversations || []
        state.loading = false
      }

      async function openConversation(id, { silent = false } = {}) {
        if (!state.projectId) return
        if (state.openingId === id) return
        const requestId = (state.openSeq || 0) + 1
        state.openSeq = requestId
        state.openingId = id
        if (!silent) {
          state.loading = true
          state.messages = []
          state.error = null
          const target = state.conversations.find((item) => item.id === id)
          if (target) state.title = target.title || '新对话'
          renderChat()
        }
        try {
          const opened = await api('/api/conversations/open', {
            method: 'POST',
            body: JSON.stringify({ projectId: state.projectId, conversationId: id || undefined })
          })
          if (state.openSeq !== requestId) return
          state.sessionId = opened.sessionId || null
          state.conversationId = opened.conversationId || id || null
          if (state.conversationId) localStorage.setItem('of.web.conversation', state.conversationId)
          state.title = (state.conversations.find((item) => item.id === state.conversationId) || {}).title || '新对话'
          const pending = state.messages.filter((message) => String(message.id).startsWith('local-'))
        state.messages = (opened.messages || []).map((message) => ({ ...message })).concat(pending)
          state.windowSize = 60
          state.streaming = false
          state.prompt = null
          state.error = null
          if (state.sessionId) {
            try {
              const running = await api('/api/running')
              state.lastSeq = Math.max(state.lastSeq, running.seq || 0)
              if ((running.sessions || []).includes(state.sessionId)) {
                state.streaming = true
                localStorage.setItem('of.web.pending', state.sessionId)
                const last = state.messages[state.messages.length - 1]
                if (last && last.role === 'assistant') {
                  last.streaming = true
                } else {
                  state.messages.push({ id: 'resume-' + Date.now(), role: 'assistant', text: '', timestamp: Date.now(), streaming: true })
                }
              }
            } catch {
              // 无法探测运行状态时按空闲处理
            }
          }
          renderSidebar()
          shouldStick = true
          renderChat()
        } catch (error) {
          if (state.openSeq !== requestId) return
          if (!silent) toast(error.message)
          state.error = error.message
          renderChat()
        } finally {
          if (state.openSeq === requestId) {
            state.openingId = null
            state.loading = false
            renderSidebar()
            renderChat()
          }
        }
      }

      async function newConversation() {
        state.conversationId = null
        state.sessionId = null
        state.title = '新对话'
        state.messages = []
        state.streaming = false
        state.prompt = null
        state.error = null
        localStorage.removeItem('of.web.draft')
        localStorage.removeItem('of.web.conversation')
        state.lastConversationId = null
        shouldStick = true
        renderSidebar()
        renderChat()
        input.focus()
        closeNav()
      }

      async function ensureSession() {
        if (state.sessionId) return state.sessionId
        if (!state.projectId) throw new Error('还没有选择项目')
        const created = await api('/api/conversations', {
          method: 'POST',
          body: JSON.stringify({ projectId: state.projectId })
        })
        state.conversationId = created.id
        state.title = created.title || '新对话'
        const opened = await api('/api/conversations/open', {
          method: 'POST',
          body: JSON.stringify({ projectId: state.projectId, conversationId: created.id })
        })
        state.sessionId = opened.sessionId || null
        state.conversationId = opened.conversationId || created.id
        state.messages = (opened.messages || []).map((message) => ({ ...message }))
        if (!state.sessionId) throw new Error('服务器没有返回会话，请先在桌面端配置模型与工作区')
        localStorage.setItem('of.web.conversation', state.conversationId)
        localStorage.setItem('of.web.project', state.projectId)
        localStorage.setItem('of.web.pending', state.sessionId)
        await loadConversations()
        renderSidebar()
        return state.sessionId
      }

      // ── 发送与事件 ──────────────────────────────────
      async function send() {
        const bare = input.value.trim()
        const files = state.attachments.slice()
        const text = files.length ? bare + '\n\n' + files.map((f) => '[附件] ' + f.path).join('\n') : bare
        const interrupting = state.streaming
        if (!text) return
        if (interrupting && !state.sessionId) return
        if (state.sending) return
        state.sending = true
        input.value = ''
        state.attachments = []
        renderAttachments()
        localStorage.removeItem('of.web.draft')
        autoGrow()
        state.error = null
        if (!interrupting) state.streaming = true
        if (!interrupting) syncTitle('busy')
        state.messages.push({ id: 'local-' + Date.now(), role: 'user', text, timestamp: Date.now() })
        shouldStick = true
        renderChat()

        try {
          const sessionId = await ensureSession()
          const mode = interrupting ? $('sendMode').value || 'steer' : 'prompt'
          await api('/api/sessions/' + encodeURIComponent(sessionId) + '/messages', {
            method: 'POST',
            body: JSON.stringify({ text, mode })
          })
          if (interrupting) toast(mode === 'followUp' ? '已加入队列，下一轮执行' : '已插话，模型会在本轮看到')
          await loadConversations()
          renderSidebar()
        } catch (error) {
          if (!interrupting) state.streaming = false
          state.error = error.message
          renderChat()
        } finally {
          state.sending = false
        }
      }

      function renderAttachments() {
        const box = $('attachChips')
        box.innerHTML = ''
        box.hidden = state.attachments.length === 0
        state.attachments.forEach((file, index) => {
          const chip = document.createElement('span')
          chip.className = 'attach-chip ' + file.kind
          chip.textContent = (file.kind === 'image' ? '🖼 ' : '📄 ') + file.name
          chip.title = file.path
          const remove = document.createElement('button')
          remove.type = 'button'
          remove.textContent = '✕'
          remove.title = '移除附件'
          remove.onclick = () => {
            state.attachments.splice(index, 1)
            renderAttachments()
          }
          chip.append(remove)
          box.append(chip)
        })
      }

      async function uploadFile(file) {
        if (file.size > 20 * 1024 * 1024) throw new Error('附件超过 20MB')
        const response = await fetch('/api/uploads', {
          method: 'POST',
          headers: { 'X-File-Name': encodeURIComponent(file.name || '附件') },
          body: file
        })
        const data = await response.json()
        if (!data.ok) throw new Error(data.error ? data.error.message : '上传失败')
        return data.value
      }

      async function attachFiles(list) {
        const files = Array.from(list || []).slice(0, 6)
        for (const file of files) {
          try {
            const uploaded = await uploadFile(file)
            state.attachments.push(uploaded)
            renderAttachments()
            toast('已添加附件：' + uploaded.name)
          } catch (error) {
            toast(error.message)
          }
        }
      }

      async function stop() {
        if (!state.sessionId) return
        state.streaming = false
        const last = activeAssistant()
        if (last) last.streaming = false
        renderChat()
        try {
          await api('/api/sessions/' + encodeURIComponent(state.sessionId) + '/stop', { method: 'POST', body: '{}' })
        } catch (error) {
          toast(error.message)
        }
      }

      function defaultTitle(title) {
        return !title || title === '新对话' || /^对话\s/.test(title)
      }

      async function finishTurn() {
        localStorage.removeItem('of.web.pending')
        if (state.conversationId) {
          localStorage.setItem('of.web.conversation', state.conversationId)
          if (state.projectId) localStorage.setItem('of.web.project', state.projectId)
        }
        await loadConversations()
        const current = state.conversations.find((item) => item.id === state.conversationId)
        if (current && current.title && !defaultTitle(current.title)) {
          state.title = current.title
          renderChat()
        }
        const firstUser = state.messages.find((message) => message.role === 'user' && message.text)
        if (state.conversationId && firstUser && defaultTitle((current || {}).title)) {
          const title = firstUser.text.replace(/\s+/g, ' ').trim().slice(0, 24)
          if (title) {
            try {
              const updated = await api('/api/conversations', {
                method: 'PATCH',
                body: JSON.stringify({ projectId: state.projectId, conversationId: state.conversationId, title })
              })
              state.title = updated.title || title
              await loadConversations()
              renderChat()
            } catch {
              // 自动命名失败不影响会话
            }
          }
        }
        renderSidebar()
      }

      function activeAssistant() {
        for (let i = state.messages.length - 1; i >= 0; i -= 1) {
          const message = state.messages[i]
          if (message.role === 'assistant' && message.streaming) return message
        }
        return null
      }

      function handleEvent(event) {
        if (!event || event.sessionId !== state.sessionId) return
        switch (event.type) {
          case 'status':
            state.streaming = event.state === 'streaming'
            if (state.streaming) syncTitle('busy')
            else {
              const last = activeAssistant()
              if (last) last.streaming = false
              syncTitle('idle')
            }
            break
          case 'user-message': {
            const exists = state.messages.some(
              (message) => message.role === 'user' && message.text === event.message.text
            )
            if (!exists) state.messages.push({ ...event.message })
            break
          }
          case 'assistant-start': {
            if (!state.messages.some((message) => message.id === event.id)) {
              const last = state.messages[state.messages.length - 1]
              if (last && last.role === 'assistant' && last.streaming) {
                // Reconnect during a running turn: continue the bubble we already show.
                last.id = event.id
              } else {
                state.messages.push({ id: event.id, role: 'assistant', text: '', thinking: '', tools: [], streaming: true, timestamp: Date.now() })
              }
            }
            break
          }
          case 'text-delta': {
            let message = state.messages.find((item) => item.id === event.id)
            if (!message) {
              message = { id: event.id, role: 'assistant', text: '', thinking: '', tools: [], streaming: true, timestamp: Date.now() }
              state.messages.push(message)
            }
            message.text += event.delta
            if (!patchStreaming(event.id)) scheduleRender()
            return
          }
          case 'thinking-delta': {
            let message = state.messages.find((item) => item.id === event.id)
            if (!message) {
              message = { id: event.id, role: 'assistant', text: '', thinking: '', tools: [], streaming: true, timestamp: Date.now() }
              state.messages.push(message)
            }
            message.thinking = (message.thinking || '') + event.delta
            if (!patchStreaming(event.id)) scheduleRender()
            return
          }
          case 'assistant-message': {
            const message = state.messages.find((item) => item.id === event.message.id)
            if (message) Object.assign(message, event.message, { streaming: false })
            else state.messages.push({ ...event.message })
            break
          }
          case 'tool-start': {
            const message = activeAssistant()
            if (message) {
              message.tools = message.tools || []
              message.tools.push({ id: event.toolCallId, label: event.name + '…', status: 'running' })
            }
            break
          }
          case 'tool-end': {
            const message = activeAssistant()
            const tool = message && (message.tools || []).find((item) => item.id === event.toolCallId)
            if (tool) {
              tool.label = event.name
              tool.status = event.isError ? 'error' : 'done'
            }
            break
          }
          case 'prompt':
            state.prompt = event.prompt
            break
          case 'prompt-done':
            if (state.prompt && state.prompt.id === event.id) state.prompt = null
            break
          case 'error':
            // A user-initiated stop arrives as an aborted request; that is not an error.
            if (/abort|cancel|interrupt|stopped/i.test(String(event.message || ''))) break
            state.error = event.message
            break
          case 'settled': {
            localStorage.removeItem('of.web.pending')
            state.streaming = false
            const last = activeAssistant()
            if (last) last.streaming = false
            if (document.hidden) syncTitle('done')
            else syncTitle('idle')
            notifyDone()
            finishTurn().catch(() => {})
            break
          }
          default:
            return
        }
        scheduleRender()
      }

      function connect() {
        if (reconnectTimer) {
          clearTimeout(reconnectTimer)
          reconnectTimer = null
        }
        if (state.source) state.source.close()
        if (navigator.onLine === false) {
          setStatus('')
          bannerText('网络已断开，恢复后会自动重连…')
          return
        }
        const source = new EventSource('/api/events?since=' + state.lastSeq)
        state.source = source
        source.addEventListener('agent', (message) => {
          try {
            const item = JSON.parse(message.data)
            state.lastSeq = Math.max(state.lastSeq, item.seq || 0)
            const event = item.event && item.event.sessionId ? item.event : { ...(item.event || {}), sessionId: item.sessionId }
            if (window.__events) {
              window.__events.push({ seq: item.seq, type: event.type, sid: event.sessionId, mine: state.sessionId })
              if (window.__events.length > 80) window.__events.shift()
            }
            handleEvent(event)
          } catch {
            // ignore malformed
          }
        })
        source.onopen = () => {
          reconnectDelay = 1000
          setStatus(state.streaming ? 'busy' : 'online')
        }
        source.onerror = () => {
          setStatus('')
          source.close()
          if (state.source === source) state.source = null
          scheduleReconnect()
        }
      }

      function autoGrow() {
        input.style.height = 'auto'
        input.style.height = Math.min(input.scrollHeight, 208) + 'px'
      }

      function closeNav() {
        document.body.classList.remove('nav-open')
      }

      // ── 交互绑定 ────────────────────────────────────
      $('sendButton').addEventListener('click', send)
      $('attachButton').addEventListener('click', () => $('filePicker').click())
      $('filePicker').addEventListener('change', async (event) => {
        await attachFiles(event.target.files)
        event.target.value = ''
      })
      input.addEventListener('paste', (event) => {
        const files = Array.from((event.clipboardData || {}).files || [])
        if (files.length) {
          event.preventDefault()
          void attachFiles(files)
        }
      })
      const composer = $('composer')
      composer.addEventListener('dragover', (event) => {
        event.preventDefault()
        composer.classList.add('dragging')
      })
      composer.addEventListener('dragleave', () => composer.classList.remove('dragging'))
      composer.addEventListener('drop', (event) => {
        event.preventDefault()
        composer.classList.remove('dragging')
        if (event.dataTransfer && event.dataTransfer.files && event.dataTransfer.files.length) {
          void attachFiles(event.dataTransfer.files)
        }
      })
      $('stopButton').addEventListener('click', stop)
      input.addEventListener('input', () => {
        autoGrow()
        $('sendButton').disabled = !input.value.trim()
        if (!state.streaming) {
          $('composerHint').textContent = 'Enter 发送 · Shift + Enter 换行' + (input.value.length ? ' · ' + input.value.length + ' 字' : '')
        }
        localStorage.setItem('of.web.draft', input.value)
      })
      input.addEventListener('keydown', (event) => {
        if (event.key === 'Enter' && !event.shiftKey && !event.isComposing) {
          event.preventDefault()
          send()
        }
      })
      $('newChat').addEventListener('click', newConversation)
      $('menuButton').addEventListener('click', () => document.body.classList.add('nav-open'))
      $('backdrop').addEventListener('click', closeNav)
      let searchTimer = 0
      $('search').addEventListener('input', (event) => {
        state.filter = event.target.value
        clearTimeout(searchTimer)
        searchTimer = setTimeout(renderSidebar, 120)
      })
      $('projectSelect').addEventListener('change', async (event) => {
        state.projectId = event.target.value
        state.conversationId = null
        state.sessionId = null
        state.messages = []
        state.title = '新对话'
        state.loading = true
        renderSidebar()
        try {
          await loadConversations()
        } catch (error) {
          toast(error.message)
        }
        renderSidebar()
        renderChat()
      })
      $('avatar').addEventListener('click', openAccount)
      $('modelChip').addEventListener('click', openSettings)
      $('settingsClose').addEventListener('click', closeSettings)
      $('settingsModal').addEventListener('click', (event) => {
        if (event.target === $('settingsModal')) closeSettings()
      })
      document.addEventListener('keydown', (event) => {
        if (event.key === 'Escape') {
          // First stop a running turn, then close overlays.
          const anyOverlay = !$('settingsModal').hidden || !$('accountModal').hidden || !$('helpModal').hidden || !$('aboutModal').hidden || !$('findBar').hidden || !!menuEl || document.body.classList.contains('nav-open')
          if (state.streaming && !anyOverlay) {
            stop()
            toast('已停止生成')
            return
          }
          closeSettings()
          closeAccount()
          closeHelp()
          closeAbout()
          closeMenu()
          closeFind()
          closeNav()
        }
        if ((event.ctrlKey || event.metaKey) && event.key === 'Enter') {
          event.preventDefault()
          newConversation()
          toast('新对话')
        }
        if (event.key === '/' && !event.ctrlKey && !event.metaKey) {
          const tag = (event.target && event.target.tagName) || ''
          if (tag !== 'INPUT' && tag !== 'TEXTAREA' && tag !== 'SELECT') {
            event.preventDefault()
            input.focus()
          }
        }
        if (event.key === '?' && !event.ctrlKey && !event.metaKey) {
          const tag = (event.target && event.target.tagName) || ''
          if (tag !== 'INPUT' && tag !== 'TEXTAREA') {
            event.preventDefault()
            openHelp()
          }
        }
        if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === 'k') {
          event.preventDefault()
          $('search').focus()
        }
        if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === 'f') {
          event.preventDefault()
          openFind()
        }
      })
      $('accountClose').addEventListener('click', closeAccount)
      $('accountModal').addEventListener('click', (event) => {
        if (event.target === $('accountModal')) closeAccount()
      })
      $('themeToggle').addEventListener('click', cycleTheme)
      $('helpButton').addEventListener('click', openHelp)
      $('helpClose').addEventListener('click', closeHelp)
      $('aboutButton').addEventListener('click', openAbout)
      $('aboutClose').addEventListener('click', closeAbout)
      $('aboutModal').addEventListener('click', (event) => {
        if (event.target === $('aboutModal')) closeAbout()
      })
      $('helpModal').addEventListener('click', (event) => {
        if (event.target === $('helpModal')) closeHelp()
      })
      $('findInput').addEventListener('input', updateFindCount)
      $('findInput').addEventListener('keydown', (event) => {
        if (event.key === 'Enter') {
          event.preventDefault()
          stepFind(event.shiftKey)
        }
        if (event.key === 'Escape') {
          event.preventDefault()
          closeFind()
        }
      })
      $('findNext').addEventListener('click', () => stepFind(false))
      $('findPrev').addEventListener('click', () => stepFind(true))
      $('findClose').addEventListener('click', closeFind)
      $('connBanner').addEventListener('click', () => {
        reconnectDelay = 1000
        connect()
        toast('正在重新连接…')
      })

      window.addEventListener('offline', () => {
        setStatus('')
        bannerText('网络已断开，恢复后会自动重连…')
      })
      window.addEventListener('online', () => {
        reconnectDelay = 1000
        toast('网络已恢复')
        connect()
      })
      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState !== 'visible') return
        if (!state.streaming) syncTitle('idle')
        if (!state.source || state.source.readyState === 2) {
          reconnectDelay = 1000
          connect()
        }
      })

      chatScroll.addEventListener('scroll', () => {
        shouldStick = chatScroll.scrollTop + chatScroll.clientHeight >= chatScroll.scrollHeight - 120
        updateToBottom()
      })
      $('toBottom').addEventListener('click', () => {
        shouldStick = true
        chatScroll.scrollTop = chatScroll.scrollHeight
        updateToBottom()
      })
      $('exportButton').addEventListener('click', exportMarkdown)

      $('conversations').addEventListener('click', (event) => {
        const more = event.target.closest('[data-more]')
        if (more) {
          event.stopPropagation()
          openMenu(more.dataset.more, more)
          return
        }
        const item = event.target.closest('.conv')
        if (!item) return
        if (state.selectMode) {
          toggleSelected(item.dataset.id)
          return
        }
        openConversation(item.dataset.id)
        closeNav()
      })

      function updateSelectBar() {
        $('selectBar').hidden = !state.selectMode
        $('selectCount').textContent = '已选 ' + state.selected.size + ' 个'
        $('selectDelete').disabled = state.selected.size === 0
        $('selectExport').disabled = state.selected.size === 0
      }

      function setSelectMode(on) {
        state.selectMode = on
        state.selected.clear()
        $('selectToggle').classList.toggle('on', on)
        if (on) closeMenu()
        renderSidebar()
        updateSelectBar()
      }

      function toggleSelected(id) {
        if (state.selected.has(id)) state.selected.delete(id)
        else state.selected.add(id)
        renderSidebar()
        updateSelectBar()
      }

      $('selectToggle').addEventListener('click', () => setSelectMode(!state.selectMode))
      $('selectCancel').addEventListener('click', () => setSelectMode(false))

      $('selectDelete').addEventListener('click', async () => {
        const ids = [...state.selected]
        if (!ids.length) return
        if (!window.confirm('删除选中的 ' + ids.length + ' 个会话？此操作不可恢复。')) return
        const removingCurrent = ids.includes(state.conversationId)
        let failed = 0
        for (const id of ids) {
          try {
            await api(
              '/api/conversations?projectId=' + encodeURIComponent(state.projectId) + '&conversationId=' + encodeURIComponent(id),
              { method: 'DELETE' }
            )
          } catch {
            failed += 1
          }
        }
        setSelectMode(false)
        if (removingCurrent) newConversation()
        await loadConversations()
        renderSidebar()
        toast(failed ? '已删除 ' + (ids.length - failed) + ' 个，' + failed + ' 个失败' : '已删除 ' + ids.length + ' 个会话')
      })

      $('selectExport').addEventListener('click', async () => {
        const ids = [...state.selected]
        if (!ids.length) return
        if (state.streaming) {
          toast('正在生成，等完成后再导出')
          return
        }
        const previous = state.conversationId
        const previousProject = state.projectId
        const sections = []
        let failed = 0
        $('selectCount').textContent = '导出中 0/' + ids.length
        for (let index = 0; index < ids.length; index += 1) {
          const id = ids[index]
          try {
            const opened = await api('/api/conversations/open', {
              method: 'POST',
              body: JSON.stringify({ projectId: previousProject, conversationId: id })
            })
            const title = (state.conversations.find((item) => item.id === id) || {}).title || id
            const lines = ['# ' + title, '']
            for (const message of coalesceMessages((opened.messages || []).map((m) => ({ ...m })))) {
              lines.push(message.role === 'user' ? '## 我' : '## OpenFuture')
              if (message.thinking) {
                lines.push('', '<details><summary>思考过程</summary>', '', message.thinking, '', '</details>')
              }
              lines.push('', String(message.text || '').trim() || '（无内容）', '')
            }
            sections.push(lines.join('\n'))
          } catch {
            failed += 1
          }
          $('selectCount').textContent = '导出中 ' + (index + 1) + '/' + ids.length
        }
        if (previous) {
          await openConversation(previous, { silent: true }).catch(() => {})
        } else {
          newConversation()
        }
        if (!sections.length) {
          toast('导出失败，没有可写入的会话')
          updateSelectBar()
          return
        }
        const blob = new Blob([sections.join('\n\n---\n\n')], { type: 'text/markdown;charset=utf-8' })
        const link = document.createElement('a')
        link.href = URL.createObjectURL(blob)
        link.download = 'OpenFuture-会话导出-' + new Date().toISOString().slice(0, 10) + '.md'
        document.body.appendChild(link)
        link.click()
        setTimeout(() => {
          URL.revokeObjectURL(link.href)
          link.remove()
        }, 1200)
        setSelectMode(false)
        toast(failed ? '已导出 ' + sections.length + ' 个，' + failed + ' 个失败' : '已导出 ' + sections.length + ' 个会话')
      })

      chat.addEventListener('click', (event) => {
        const download = event.target.closest('[data-download]')
        if (download) {
          const chunk = codeChunks.get(Number(download.dataset.download))
          if (!chunk) return
          const ext = { js: 'js', ts: 'ts', python: 'py', py: 'py', java: 'java', json: 'json', bash: 'sh', sh: 'sh', powershell: 'ps1', html: 'html', css: 'css', sql: 'sql', xml: 'xml', yaml: 'yml', yml: 'yml', markdown: 'md', md: 'md' }[chunk.lang] || 'txt'
          const blob = new Blob([chunk.text], { type: 'text/plain;charset=utf-8' })
          const link = document.createElement('a')
          link.href = URL.createObjectURL(blob)
          link.download = 'code-' + Date.now() + '.' + ext
          document.body.appendChild(link)
          link.click()
          setTimeout(() => {
            URL.revokeObjectURL(link.href)
            link.remove()
          }, 1200)
          toast('已下载代码')
          return
        }
        const expand = event.target.closest('[data-expand]')
        if (expand) {
          const chunk = codeChunks.get(Number(expand.dataset.expand))
          const block = expand.closest('.code-block')
          const code = block && block.querySelector('code')
          if (chunk && code) {
            code.innerHTML = chunk.lines
              .map((line) => '<span class="line"><span class="ln"></span>' + line + '</span>')
              .join('')
            const foot = expand.closest('.code-foot')
            if (foot) foot.remove()
          }
          return
        }
        const copy = event.target.closest('[data-copy]')
        if (copy) {
          const block = copy.closest('.code-block')
          const code = block && block.querySelector('code')
          if (code) navigator.clipboard.writeText(code.textContent || '').then(() => toast('已复制'))
          return
        }
        const action = event.target.closest('[data-act]')
        if (action) {
          const node = action.closest('.msg')
          const id = node && node.dataset.id
          const message = state.messages.find((item) => item.id === id)
          if (!message) return
          if (action.dataset.act === 'copy') {
            navigator.clipboard.writeText(message.text || '').then(() => toast('已复制'))
            return
          }
          if (action.dataset.act === 'quote') {
            const snippet = String(message.text || '').replace(/\s+/g, ' ').trim().slice(0, 160)
            if (!snippet) return
            const quoted = '> ' + snippet + (snippet.length >= 160 ? '…' : '') + '\n\n'
            const start = input.selectionStart || input.value.length
            input.value = input.value.slice(0, start) + quoted + input.value.slice(start)
            autoGrow()
            input.dispatchEvent(new Event('input', { bubbles: true }))
            input.focus()
            input.setSelectionRange(start + quoted.length, start + quoted.length)
            toast('已引用到输入框')
            return
          }
          if (action.dataset.act === 'edit') {
            input.value = message.text || ''
            autoGrow()
            input.dispatchEvent(new Event('input', { bubbles: true }))
            input.focus()
            input.setSelectionRange(input.value.length, input.value.length)
            toast('已填入输入框，修改后点发送')
            return
          }
          regenerate(message)
          return
        }
        const suggestion = event.target.closest('[data-suggest]')
        if (suggestion) {
          input.value = suggestion.dataset.suggest
          autoGrow()
          input.dispatchEvent(new Event('input'))
          input.focus()
        }
      })

      async function retryLast() {
        if (state.streaming) return
        const lastUser = [...state.messages].reverse().find((item) => item.role === 'user')
        if (!lastUser) return
        state.error = null
        state.streaming = true
        syncTitle('busy')
        renderChat()
        try {
          const sessionId = await ensureSession()
          await api('/api/sessions/' + encodeURIComponent(sessionId) + '/messages', {
            method: 'POST',
            body: JSON.stringify({ text: lastUser.text, mode: 'prompt' })
          })
        } catch (error) {
          state.streaming = false
          state.error = error.message
          renderChat()
        }
      }

      async function regenerate(message) {
        if (state.streaming) return
        const index = state.messages.indexOf(message)
        if (index < 0) return
        let lastUser = null
        for (let i = index; i >= 0; i -= 1) {
          if (state.messages[i].role === 'user') {
            lastUser = state.messages[i]
            break
          }
        }
        if (!lastUser) return
        state.messages.splice(index)
        state.streaming = true
        renderChat()
        try {
          const sessionId = await ensureSession()
          await api('/api/sessions/' + encodeURIComponent(sessionId) + '/messages', {
            method: 'POST',
            body: JSON.stringify({ text: lastUser.text, mode: 'prompt' })
          })
        } catch (error) {
          state.streaming = false
          state.error = error.message
          renderChat()
        }
      }

      // ── 导出与滚动 ──────────────────────────────────
      function safeFileName(title) {
        const value = String(title || '对话')
          .replace(/[\\/:*?"<>|\s]+/g, ' ')
          .trim()
          .slice(0, 40)
        return value || '对话'
      }

      function exportMarkdown() {
        if (!state.messages.length) {
          toast('当前会话还没有消息')
          return
        }
        const lines = ['# ' + (state.title || '对话'), '', '> 导出时间：' + new Date().toLocaleString(), '']
        for (const message of coalesceMessages(state.messages)) {
          lines.push(message.role === 'user' ? '## 我' : '## OpenFuture')
          if (message.thinking) {
            lines.push('', '<details><summary>思考过程</summary>', '', message.thinking, '', '</details>')
          }
          if (message.tools && message.tools.length) {
            lines.push('', message.tools.map((tool) => '- 工具：' + tool.label).join('\n'))
          }
          lines.push('', String(message.text || '').trim() || '（无内容）', '')
        }
        const blob = new Blob([lines.join('\n')], { type: 'text/markdown;charset=utf-8' })
        const link = document.createElement('a')
        link.href = URL.createObjectURL(blob)
        link.download = safeFileName(state.title) + '.md'
        document.body.appendChild(link)
        link.click()
        setTimeout(() => {
          URL.revokeObjectURL(link.href)
          link.remove()
        }, 1200)
        toast('已导出 Markdown')
      }

        const button = $('toBottom')

      // ── 会话内查找 ──────────────────────────────────
      function findQuery() {
        return $('findInput').value.trim()
      }

      function updateFindCount() {
        const query = findQuery()
        const label = $('findCount')
        if (!query) {
          label.textContent = '0 处'
          return
        }
        const haystack = (chat.innerText || '').toLowerCase()
        const needle = query.toLowerCase()
        let count = 0
        let index = haystack.indexOf(needle)
        while (index >= 0) {
          count += 1
          index = haystack.indexOf(needle, index + needle.length)
        }
        label.textContent = count + ' 处'
      }

      function openFind() {
        $('findBar').hidden = false
        $('findInput').focus()
        $('findInput').select()
        updateFindCount()
      }

      function closeFind() {
        $('findBar').hidden = true
        const selection = window.getSelection()
        if (selection) selection.removeAllRanges()
      }

      function stepFind(backwards) {
        const query = findQuery()
        if (!query) {
          $('findInput').focus()
          return
        }
        window.find(query, false, backwards, true, false, true, false)
        updateFindCount()
      }

      let menuEl = null
      function openMenu(id, anchor) {
        closeMenu()
        const conversation = state.conversations.find((item) => item.id === id)
        if (!conversation) return
        const menu = document.createElement('div')
        menu.className = 'conv-menu'
        menu.innerHTML =

          '<button type="button" data-menu="export">导出 Markdown</button>' +
          '<button type="button" data-menu="delete" class="danger">删除</button>'
        document.body.appendChild(menu)
        const rect = anchor.getBoundingClientRect()
        menu.style.left = Math.min(rect.left, window.innerWidth - 150) + 'px'
        menu.style.top = rect.bottom + 4 + 'px'
        menu.addEventListener('click', async (event) => {
          const action = event.target.closest('[data-menu]')
          if (!action) return
          closeMenu()

            return
          }
          if (action.dataset.menu === 'export') {

            return
          }
          if (action.dataset.menu === 'rename') {

            if (!title || !title.trim()) return
            try {
              await api('/api/conversations', {
                method: 'PATCH',
                body: JSON.stringify({ projectId: state.projectId, conversationId: id, title: title.trim() })
              })
              if (id === state.conversationId) state.title = title.trim()
              await loadConversations()
              renderSidebar()
              renderChat()
            } catch (error) {
              toast(error.message)
            }
          } else {
            if (!window.confirm('删除对话「' + conversation.title + '」？此操作不可恢复。')) return
            try {
              await api(
                '/api/conversations?projectId=' +
                  encodeURIComponent(state.projectId) +
                  '&conversationId=' +
                  encodeURIComponent(id),
                { method: 'DELETE' }
              )
              if (id === state.conversationId) newConversation()
              await loadConversations()
              renderSidebar()
            } catch (error) {
              toast(error.message)
            }
          }
        })
        menuEl = menu

      function accountEscape(value) {
        return escapeHtml(String(value == null ? '' : value))
      }

      function closeAccount() {

        accountUI.timer = null
        accountUI.qr = null

      }

      async function openAccount() {
        $('accountModal').hidden = false
        $('accountBody').innerHTML = '<div class="skeleton">正在读取账户…</div>'
        await refreshAccount()
      }

      async function refreshAccount() {
        try {
          accountUI.status = await api('/api/account/status')
        } catch (error) {
          accountUI.status = { signedIn: false, error: error.message }
        }
        accountUI.info = null
        if (accountUI.status && accountUI.status.signedIn) {
          try {
            accountUI.info = await api('/api/account')
          } catch {
            accountUI.info = null
          }
        }
        if (accountUI.status && accountUI.status.signedIn && accountUI.info) {
          const label = accountUI.info.nickname || accountUI.info.phone || '已登录'
          $('accountName').textContent = label
          $('accountHint').textContent = '余额 ' + accountUI.info.balanceYuan + ' 元'
          $('avatar').textContent = (label[0] || 'OF').toUpperCase()
        } else {
          $('accountName').textContent = '本地工作区'
          $('accountHint').textContent = '未登录账号'
          $('avatar').textContent = 'OF'
        }
        renderAccount()
      }

      function renderAccount() {
        const body = $('accountBody')
        const signedIn = !!(accountUI.status && accountUI.status.signedIn && accountUI.info)
        if (accountUI.tab === 'qr' && !signedIn) {
          body.innerHTML =
            '<div class="account-qr" id="qrBox"></div>' +
            '<div class="account-hintline">用手机 OpenFuture App 扫码，或输入下方 6 位码确认。</div>'
          startQr()
          return
        }
        if (signedIn) {
          const info = accountUI.info
          body.innerHTML =
            '<div class="account-profile"><div class="account-avatar">' +
            accountEscape((info.nickname || info.phone || 'OF')[0]) +
            '</div><div><div class="account-name">' +
            accountEscape(info.nickname || '已登录') +
            '</div><div class="account-phone">' +
            accountEscape(info.phone) +
            '</div></div></div>' +
            '<div class="account-balance"><span>余额</span><b>￥' +

          $('signOut').addEventListener('click', async () => {

        }
        const signedOut = accountUI.status && accountUI.status.base
        const codeBlock = accountUI.sms

          : '<input class="account-field" id="accPassword" placeholder="密码" type="password" />'
        body.innerHTML =

          '<button data-tab="login" class="' + (accountUI.tab === 'login' ? 'active' : '') + '">账号登录</button>' +
          '<button data-tab="qr" class="' + (accountUI.tab === 'qr' ? 'active' : '') + '">扫码登录</button>' +
          '</div>' +
          '<input class="account-field" id="accPhone" placeholder="手机号" inputmode="numeric" />' +
          codeBlock +
          '<button class="account-main" id="accLogin">登录</button>' +
          '<button class="account-link" id="accToggleSms">' +
          (accountUI.sms ? '改用密码登录' : '没有密码？用验证码登录') +
          '</button>' +
          '<div class="account-hintline">' +
          (signedOut ? '账号服务：' + accountEscape(accountUI.status.base) : '账号服务未配置，请在桌面端账户面板里设置地址。') +
          '</div>' +
          (accountUI.error ? '<div class="error-line">' + accountEscape(accountUI.error) + '</div>' : '')
        body.querySelectorAll('[data-tab]').forEach((button) => {
          button.addEventListener('click', () => {
            accountUI.tab = button.dataset.tab
            accountUI.error = ''
            renderAccount()
          })
        })
        const login = async () => {
          const phone = $('accPhone').value.trim()
          if (!/^1\d{10}$/.test(phone)) {
            accountUI.error = '请输入 11 位手机号'
            renderAccount()
            return
          }
          try {
            if (accountUI.sms) {
              const code = $('accCode').value.trim()
              if (!/^\d{6}$/.test(code)) {
                accountUI.error = '请输入 6 位验证码'
                renderAccount()
                return
              }
              await api('/api/account/login-sms', { method: 'POST', body: JSON.stringify({ phone, code }) })
            } else {
              const password = $('accPassword').value
              if (!password) {
                accountUI.error = '请填写密码'
                renderAccount()
                return
              }
              await api('/api/account/login', { method: 'POST', body: JSON.stringify({ phone, password }) })

            renderAccount()
          }

        if (passwordInput) {

            if (event.key === 'Enter') login()
          })
        }
        $('accToggleSms').addEventListener('click', () => {
          accountUI.sms = !accountUI.sms
          accountUI.error = ''
          renderAccount()
        })
        const sendCode = async () => {
          const phone = $('accPhone').value.trim()
          if (!/^1\d{10}$/.test(phone)) {
            accountUI.error = '请先填写 11 位手机号'
            renderAccount()
            return
          }
          try {
            const sent = await api('/api/account/sms', { method: 'POST', body: JSON.stringify({ phone }) })
            if (sent.devCode) {
              const input = $('accCode')
              if (input) input.value = sent.devCode
              toast('开发模式验证码：' + sent.devCode)
            } else {
              toast('验证码已发送')
            }
            accountUI.cooldown = 60
            if (accountUI.cooldownTimer) clearInterval(accountUI.cooldownTimer)
            accountUI.cooldownTimer = setInterval(() => {
              accountUI.cooldown = Math.max(0, accountUI.cooldown - 1)
              const button = $('accSendCode')
              if (button) button.textContent = accountUI.cooldown > 0 ? accountUI.cooldown + 's' : '获取验证码'
              if (accountUI.cooldown <= 0 && accountUI.cooldownTimer) {
                clearInterval(accountUI.cooldownTimer)
                accountUI.cooldownTimer = null
              }
            }, 1000)
            renderAccount()
          } catch (error) {
            accountUI.error = error.message
            renderAccount()
          }
        }
        const sendButton = $('accSendCode')
        if (sendButton) sendButton.addEventListener('click', sendCode)
      }

      async function startQr() {
        if (accountUI.timer) clearInterval(accountUI.timer)
        try {
          const ticket = await api('/api/account/qr')
          accountUI.qr = ticket
          const box = $('qrBox')
          if (!box) return
          box.innerHTML =
            '<img alt="登录二维码" src="' + accountEscape(ticket.imageDataUrl) + '" />' +
            '<div class="account-code">' + accountEscape(ticket.code) + '</div>' +
            '<div class="account-hintline">' + Math.round((ticket.expiresInSeconds || 120) / 60) + ' 分钟内有效</div>'
          accountUI.timer = setInterval(async () => {
            try {
              const poll = await api('/api/account/qr/poll?ticket=' + encodeURIComponent(ticket.ticket))
              if (poll.status === 'claimed') {
                clearInterval(accountUI.timer)
                accountUI.timer = null
                accountUI.tab = 'login'
                await refreshAccount()
                toast('扫码登录成功')
              } else if (poll.status === 'expired' || poll.status === 'used') {
                clearInterval(accountUI.timer)
                accountUI.timer = null
                const current = $('qrBox')
                if (current) current.innerHTML = '<div class="skeleton">二维码已过期，正在刷新…</div>'
                setTimeout(startQr, 600)
              }
            } catch {
              // 轮询失败时保持当前二维码
            }
          }, 1600)
        } catch (error) {
          accountUI.error = error.message
          const box = $('qrBox')
          if (box) box.innerHTML = '<div class="error-line">' + accountEscape(error.message) + '</div>'
        }
      }

      // 手机键盘弹出时用 visualViewport 收紧高度，避免输入框被遮住。
      function syncViewport() {
        const vv = window.visualViewport
        if (!vv) return
        const compact = window.matchMedia('(max-width: 900px)').matches
        document.documentElement.style.setProperty('--app-h', compact ? Math.round(vv.height) + 'px' : '100%')
        if (compact && vv.height < window.innerHeight - 120) {
          setTimeout(() => { chatScroll.scrollTop = chatScroll.scrollHeight }, 120)
        }
      }
      if (window.visualViewport) {
        window.visualViewport.addEventListener('resize', syncViewport)
        window.visualViewport.addEventListener('scroll', syncViewport)
        syncViewport()
      }

      // ── 主题与快捷键帮助 ───────────────────────────
      const THEME_LABELS = { system: '跟随系统', light: '浅色', dark: '深色' }
      const THEME_ICONS = { system: '◐', light: '☀', dark: '🌙' }
      const systemDark = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null

      function applyTheme(mode) {
        const value = THEME_LABELS[mode] ? mode : 'system'
        const dark = value === 'dark' || (value === 'system' && systemDark && systemDark.matches)
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light')
        document.documentElement.setAttribute('data-theme-mode', value)
        localStorage.setItem('of.web.theme', value)
        const button = $('themeToggle')
        button.textContent = THEME_ICONS[value]
        button.title = '主题：' + THEME_LABELS[value] + '（点击切换）'
      }

      function cycleTheme() {
        const order = ['system', 'light', 'dark']
        const current = document.documentElement.getAttribute('data-theme-mode') || 'system'
        const next = order[(order.indexOf(current) + 1) % order.length]
        applyTheme(next)
        toast('主题：' + THEME_LABELS[next])
      }

      function applyDensity(value) {
        const compact = value === 'compact'
        document.body.classList.toggle('compact', compact)
        localStorage.setItem('of.web.density', compact ? 'compact' : 'comfortable')
      }

      const baseTitle = document.title

      function syncTitle(mode) {
        const name = state.title && state.title !== '新对话' ? state.title : 'OpenFuture'
        if (mode === 'busy') document.title = '● 生成中 · ' + name
        else if (mode === 'done') document.title = '● 完成 · ' + name
        else document.title = mode === 'idle' ? baseTitle : document.title
      }

      function playDoneSound() {
        if (localStorage.getItem('of.web.sound') !== 'on') return
        try {
          const Ctx = window.AudioContext || window.webkitAudioContext
          if (!Ctx) return
          const ctx = new Ctx()
          const osc = ctx.createOscillator()
          const gain = ctx.createGain()
          osc.type = 'sine'
          osc.frequency.value = 880
          gain.gain.setValueAtTime(0.08, ctx.currentTime)
          gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.22)
          osc.connect(gain).connect(ctx.destination)
          osc.start()
          osc.stop(ctx.currentTime + 0.24)
          setTimeout(() => ctx.close && ctx.close(), 400)
        } catch {
          // 音频不可用时静默
        }
      }

      function notifyDone() {
        playDoneSound()
        if (!document.hidden) return
        if (localStorage.getItem('of.web.notify') === 'off') return
        if (!('Notification' in window) || Notification.permission !== 'granted') return
        try {
          const note = new Notification('OpenFuture', {
            body: '回复已完成：' + (state.title || '当前对话'),
            tag: 'of-done'
          })
          note.onclick = () => {
            window.focus()
            note.close()
          }
        } catch {
          // 通知失败不影响对话
        }
      }

      function openHelp() {
        $('helpModal').hidden = false
      }

      async function openAbout() {
        closeHelp()
        const body = $('aboutBody')
        body.innerHTML = '<div class="skeleton">正在读取运行信息…</div>'
        $('aboutModal').hidden = false
        let info = {}
        try { info = await (await fetch('/api/ping')).json() } catch (error) { info = {} }
        const version = (info.value && info.value.version) || '未知'
        const started = info.value && info.value.startedAt ? new Date(info.value.startedAt) : null
        const model = state.settings && state.settings.model
        const rows = [
          ['版本', version],
          ['访问地址', location.origin],
          ['工作区', (state.settings && state.settings.workspace) || '未配置'],
          ['模型', model ? (model.displayName || model.modelId) + ' · ' + (model.providerId || '') : '未配置'],
          ['项目 / 会话', state.projects.length + ' / ' + state.conversations.length],
          ['服务启动', started ? started.toLocaleString() : '未知'],
          ['浏览器', navigator.userAgent]
        ]
        body.innerHTML =
          '<div class="about-hero"><div class="about-mark">OF</div><div><b>OpenFuture</b><span>桌面端同源的浏览器工作台</span></div></div>' +
          '<dl class="about-grid">' +
          rows.map(([k, v]) => '<dt>' + k + '</dt><dd>' + escapeHtml(String(v)) + '</dd>').join('') +
          '</dl>'
      }

      function closeAbout() {
        $('aboutModal').hidden = true
      }

      function closeHelp() {
        $('helpModal').hidden = true
      }

      // ── 启动 ────────────────────────────────────────
      applyTheme(localStorage.getItem('of.web.theme') || 'system')
      applyDensity(localStorage.getItem('of.web.density') || 'comfortable')
      if (localStorage.getItem('of.web.lineNumbers') === 'off') document.body.classList.add('no-line-numbers')
      if (systemDark) {
        const onSystemTheme = () => {
          if ((document.documentElement.getAttribute('data-theme-mode') || 'system') === 'system') applyTheme('system')
        }
        if (systemDark.addEventListener) systemDark.addEventListener('change', onSystemTheme)
      }

      refreshAccount().catch(() => {})
      const draft = localStorage.getItem('of.web.draft')
      if (draft) {
        input.value = draft
        autoGrow()
        $('sendButton').disabled = !draft.trim()
      }
      loadState()
        .then(async () => {
          if (!state.projectId) return
          await loadConversations().catch(() => {})
          renderSidebar()
          renderChat()
          const savedConversation = localStorage.getItem('of.web.conversation')
          if (savedConversation && state.conversations.some((item) => item.id === savedConversation)) {
            await openConversation(savedConversation, { silent: true }).catch(() => {})
          }
        })
        .catch(() => {})
        .finally(() => {
          connect()
        })
    </script>
  </body>
</html>
