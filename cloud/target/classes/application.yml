server:
  port: 8090
  compression:
    enabled: true

spring:
  application:
    name: openfuture-cloud
  datasource:
    url: jdbc:h2:file:./data/openfuture;MODE=MySQL;AUTO_SERVER=TRUE
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Shanghai
  h2:
    console:
      enabled: true
      path: /h2-console
  jackson:
    default-property-inclusion: non_null

openfuture:
  # 生产环境务必替换，并用环境变量注入
  jwt-secret: ${OF_JWT_SECRET:openfuture-dev-jwt-secret-change-me-0123456789}
  jwt-ttl-hours: 720
  admin-token: ${OF_ADMIN_TOKEN:dev-admin}
  pay-secret: ${OF_PAY_SECRET:dev-pay-secret}
  auth:
    # 自用/联调阶段：短信验证码固定 123456；上线前接短信服务并关闭
    dev-sms: ${OF_DEV_SMS:true}
  pay:
    # 自用/联调阶段：允许直接模拟支付回调；上线前接真实支付并关闭
    dev-mode: ${OF_PAY_DEV_MODE:true}
  # 上游模型网关；留空则 /v1 走演示回声，便于没有 key 时联调
  upstream:
    base-url: ${OF_UPSTREAM_BASE_URL:}
    api-key: ${OF_UPSTREAM_API_KEY:}
  billing:
    default-prompt-per-m: 2000000      # 微元 / 1M tokens = 2 元
    default-completion-per-m: 8000000  # 微元 / 1M tokens = 8 元
    min-balance-micros: 0

logging:
  level:
    com.openfuture.cloud: INFO
