server:
  port: 8090
  compression:
    enabled: true

spring:
  application:
    name: openfuture-cloud
  datasource:
    url: jdbc:h2:file:./data/openfuture;MODE=MySQL;AUTO_SERVER=TRUE
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Shanghai
  h2:
    console:
      enabled: true
      path: /h2-console
  jackson:
    default-property-inclusion: non_null

openfuture:
  # 二维码里写入的公网/局域网地址；手机扫码后按这个地址回连
  public-base-url: ${OF_PUBLIC_BASE_URL:http://127.0.0.1:8090}
  housekeeping:
    enabled: true
    # 每个小时跑一次（3600000ms）
    interval-ms: ${OF_HOUSEKEEPING_INTERVAL_MS:3600000}
    initial-delay-ms: 120000
  # 生产环境务必替换，并用环境变量注入
  jwt-secret: ${OF_JWT_SECRET:openfuture-dev-jwt-secret-change-me-0123456789}
  jwt-ttl-hours: 720
  admin-token: ${OF_ADMIN_TOKEN:dev-admin}
  pay-secret: ${OF_PAY_SECRET:dev-pay-secret}
  auth:
    # 自用/联调阶段：短信验证码固定 123456；上线前接短信服务并关闭
    dev-sms: ${OF_DEV_SMS:true}
  sms:
    # dev = 只打日志（验证码回给前端）；aliyun = 真发短信
    provider: ${OF_SMS_PROVIDER:dev}
    aliyun:
      access-key-id: ${OF_SMS_AK_ID:}
      access-key-secret: ${OF_SMS_AK_SECRET:}
      sign-name: ${OF_SMS_SIGN_NAME:}
      template-code: ${OF_SMS_TEMPLATE_CODE:}
  pay:
    # 自用/联调阶段：允许直接模拟支付回调；上线前接真实支付并关闭
    dev-mode: ${OF_PAY_DEV_MODE:true}
    # dev = 本地模拟收银台；alipay = 支付宝电脑网站支付
    provider: ${OF_PAY_PROVIDER:dev}
    alipay:
      app-id: ${OF_ALIPAY_APP_ID:}
      private-key: ${OF_ALIPAY_PRIVATE_KEY:}
      public-key: ${OF_ALIPAY_PUBLIC_KEY:}
      gateway: ${OF_ALIPAY_GATEWAY:https://openapi.alipay.com/gateway.do}
      notify-url: ${OF_ALIPAY_NOTIFY_URL:}
      return-url: ${OF_ALIPAY_RETURN_URL:}
  # 上游模型网关；留空则 /v1 走演示回声，便于没有 key 时联调
  upstream:
    base-url: ${OF_UPSTREAM_BASE_URL:}
    api-key: ${OF_UPSTREAM_API_KEY:}
  billing:
    default-prompt-per-m: 2000000      # 微元 / 1M tokens = 2 元
    default-completion-per-m: 8000000  # 微元 / 1M tokens = 8 元
    min-balance-micros: 0

logging:
  level:
    com.openfuture.cloud: INFO
