appId: dev.openfuture.desktop
productName: OpenFuture
copyright: Copyright © 2026 OpenFuture
directories:
  output: release
  buildResources: build
files:
  - out/**/*
  - package.json
  - '!**/*.map'
asar: false
extraResources:
  - from: parallel/rag/src/docling/worker.py
    to: openfuture-docling/worker.py
npmRebuild: false
win:
  target:
    - target: nsis
      arch:
        - x64
  artifactName: OpenFuture-${version}-${arch}-setup.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: OpenFuture
  deleteAppDataOnUninstall: false
